<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#425272"/>
      <stop offset="100%" stop-color="#1f2838"/>
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect x="3" y="3" width="122" height="122" rx="28" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>

  <!-- Clean pitch -->
  <rect x="20" y="30" width="88" height="68" rx="16" fill="none" stroke="#5b8cff" stroke-width="4.5" stroke-opacity="0.9"/>

  <!-- Center line and circle -->
  <line x1="64" y1="30" x2="64" y2="98" stroke="#5b8cff" stroke-width="3" stroke-opacity="0.45"/>
  <circle cx="64" cy="64" r="16" fill="none" stroke="#5b8cff" stroke-width="3" stroke-opacity="0.45"/>

  <!-- Red player disc -->
  <circle cx="42" cy="64" r="9.5" fill="#ff5a5f"/>
  <circle cx="42" cy="64" r="4" fill="#ffffff"/>

  <!-- Blue player disc -->
  <circle cx="86" cy="64" r="9.5" fill="#4ea1ff"/>
  <circle cx="86" cy="64" r="4" fill="#ffffff"/>

  <!-- Ball -->
  <circle cx="64" cy="64" r="5.5" fill="#ffffff"/>
</svg>